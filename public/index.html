<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>amvauto</title>
<meta name="description" content="Propose des rushs sakuga exploitables pour monter un AMV, à partir d'un nom d'animé." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎞️</text></svg>" />
<style>
  /* Palette : crayon bleu du rough, crayon rouge de la correction, graphite du
     banc de montage. Neutres légèrement bleutés, jamais du gris pur. */
  :root {
    --ground: #eef1f5;
    --surface: #ffffff;
    --surface-2: #e4e9f1;
    --line: #ccd4e1;
    --ink: #161b24;
    --ink-muted: #5b6678;
    --accent: #14639f;
    --accent-ink: #ffffff;
    --accent-wash: rgba(20, 99, 159, 0.10);
    --warn: #b8412a;
    --good: #226c50;
    --shadow: 0 1px 2px rgba(18, 26, 40, .08), 0 8px 24px rgba(18, 26, 40, .06);

    --font-display: Charter, "Bitstream Charter", "Sitka Text", Georgia, "Times New Roman", serif;
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

    --radius: 6px;
    --gap: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #12161f;
      --surface: #1a1f2b;
      --surface-2: #232937;
      --line: #2f3746;
      --ink: #e7eaf1;
      --ink-muted: #949db1;
      --accent: #5aa9e6;
      --accent-ink: #0d1219;
      --accent-wash: rgba(90, 169, 230, 0.14);
      --warn: #e0765d;
      --good: #4fb68c;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .28);
    }
  }
  :root[data-theme="dark"] {
    --ground: #12161f;
    --surface: #1a1f2b;
    --surface-2: #232937;
    --line: #2f3746;
    --ink: #e7eaf1;
    --ink-muted: #949db1;
    --accent: #5aa9e6;
    --accent-ink: #0d1219;
    --accent-wash: rgba(90, 169, 230, 0.14);
    --warn: #e0765d;
    --good: #4fb68c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .28);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  .wrap { max-width: 1220px; margin: 0 auto; padding: 0 20px 120px; }

  /* --- en-tête ------------------------------------------------------- */
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 28px 0 20px;
    border-bottom: 1px solid var(--line);
  }
  .wordmark {
    font-family: var(--font-display);
    font-size: 30px; font-weight: 700; letter-spacing: -0.015em;
    margin: 0;
  }
  .wordmark span { color: var(--accent); }
  .tagline { color: var(--ink-muted); margin: 0; max-width: 52ch; }
  .theme-toggle {
    margin-left: auto; background: none; border: 1px solid var(--line);
    color: var(--ink-muted); border-radius: var(--radius);
    font: 500 12px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase;
    padding: 8px 12px; cursor: pointer;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

  /* --- barre de recherche -------------------------------------------- */
  .console { padding: 22px 0 8px; display: flex; flex-direction: column; gap: 14px; }
  .search-row { display: flex; gap: 10px; flex-wrap: wrap; position: relative; }
  .field { position: relative; flex: 1 1 320px; min-width: 240px; }
  input[type="search"] {
    width: 100%; padding: 13px 14px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--radius);
    font: 400 16px/1.2 var(--font-ui);
  }
  input[type="search"]:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-wash); }
  button.go {
    padding: 13px 22px; border: 1px solid var(--accent); border-radius: var(--radius);
    background: var(--accent); color: var(--accent-ink);
    font: 600 15px/1.2 var(--font-ui); cursor: pointer;
  }
  button.go:disabled { opacity: .55; cursor: progress; }

  .suggest {
    position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden; max-height: 320px; overflow-y: auto;
  }
  .suggest button {
    display: flex; justify-content: space-between; gap: 12px; width: 100%;
    padding: 9px 14px; background: none; border: 0; cursor: pointer;
    color: var(--ink); font: 400 14px/1.4 var(--font-ui); text-align: left;
  }
  .suggest button:hover, .suggest button[aria-selected="true"] { background: var(--accent-wash); }
  .suggest code { font: 400 11px/1.4 var(--font-mono); color: var(--ink-muted); }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filters .label {
    font: 500 11px/1 var(--font-mono); letter-spacing: .09em; text-transform: uppercase;
    color: var(--ink-muted); margin-right: 4px;
  }
  .chip {
    padding: 7px 13px; border-radius: 100px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-muted);
    font: 500 13px/1 var(--font-ui);
  }
  .chip:hover { color: var(--ink); border-color: var(--ink-muted); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  /* --- résultats ------------------------------------------------------ */
  .status { padding: 20px 0; color: var(--ink-muted); }
  .status strong { color: var(--ink); }
  .error { border-left: 3px solid var(--warn); padding: 12px 16px; background: var(--surface); border-radius: 0 var(--radius) var(--radius) 0; }

  .result-head {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 26px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 22px;
  }
  .result-head h2 { font-family: var(--font-display); font-size: 26px; margin: 0; font-weight: 700; }
  .result-head .meta { font: 400 12px/1.4 var(--font-mono); color: var(--ink-muted); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: var(--gap); }

  .cut {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column;
  }
  .cut:hover { border-color: var(--accent); }
  .cut.picked { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-wash); }

  .frame { position: relative; aspect-ratio: 16 / 9; background: var(--surface-2); cursor: pointer; border: 0; padding: 0; width: 100%; display: block; }
  .frame img, .frame video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .frame .play {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.6); font-size: 30px;
    background: linear-gradient(180deg, rgba(10,14,22,0) 45%, rgba(10,14,22,.45));
    transition: opacity .15s;
  }
  .frame:hover .play { opacity: .75; }
  .score {
    position: absolute; top: 8px; left: 8px;
    background: rgba(10, 14, 22, .82); color: #fff;
    font: 600 12px/1 var(--font-mono); letter-spacing: .02em;
    padding: 5px 7px; border-radius: 4px; font-variant-numeric: tabular-nums;
  }
  .rank {
    position: absolute; top: 8px; right: 8px;
    background: var(--accent); color: var(--accent-ink);
    font: 600 11px/1 var(--font-mono); padding: 5px 7px; border-radius: 4px;
  }

  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
  .artists { font-family: var(--font-display); font-size: 17px; font-weight: 700; line-height: 1.25; margin: 0; }
  .artists.unknown { color: var(--ink-muted); font-weight: 400; font-style: italic; }
  .specs { font: 400 11.5px/1.5 var(--font-mono); color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font: 500 11px/1 var(--font-mono); padding: 4px 7px; border-radius: 3px;
    background: var(--accent-wash); color: var(--accent);
  }
  .tag.flag { background: none; color: var(--warn); border: 1px solid currentColor; }
  .tag.flag.hd { color: var(--good); }

  .actions { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; }
  .actions a, .actions button {
    flex: 1; text-align: center; padding: 8px 6px; border-radius: 4px;
    border: 1px solid var(--line); background: none; color: var(--ink-muted);
    font: 500 12px/1 var(--font-ui); cursor: pointer; text-decoration: none;
  }
  .actions a:hover, .actions button:hover { border-color: var(--accent); color: var(--accent); }
  .actions button.picked { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  /* --- panier --------------------------------------------------------- */
  .basket {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--surface); border-top: 1px solid var(--line);
    box-shadow: 0 -6px 24px rgba(10, 14, 22, .10);
  }
  .basket-inner {
    max-width: 1220px; margin: 0 auto; padding: 12px 20px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .basket .count { font: 500 13px/1 var(--font-mono); color: var(--ink-muted); margin-right: auto; }
  .basket .count b { color: var(--ink); font-size: 15px; }
  .basket button {
    padding: 9px 15px; border-radius: var(--radius); cursor: pointer;
    border: 1px solid var(--line); background: none; color: var(--ink);
    font: 500 13px/1 var(--font-ui);
  }
  .basket button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .basket button:hover { border-color: var(--accent); }

  .skeleton { background: var(--surface-2); border-radius: var(--radius); height: 250px; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .55 } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  footer { padding: 40px 0 0; color: var(--ink-muted); font-size: 13px; border-top: 1px solid var(--line); margin-top: 48px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="wordmark">amv<span>auto</span></h1>
    <p class="tagline">Un nom d'animé, une liste de rushs sakuga classés pour le montage.</p>
    <button class="theme-toggle" id="theme" type="button">thème</button>
  </header>

  <section class="console">
    <div class="search-row">
      <div class="field">
        <input type="search" id="anime" placeholder="Chainsaw Man, Frieren, Mob Psycho…"
               autocomplete="off" spellcheck="false" aria-label="Nom de l'animé" />
        <div class="suggest" id="suggest" hidden></div>
      </div>
      <button class="go" id="go" type="button">Chercher des rushs</button>
    </div>
    <div class="filters" id="moods">
      <span class="label">Ambiance</span>
    </div>
  </section>

  <div id="out"></div>

  <footer>
    Rushs et vignettes : <a href="https://www.sakugabooru.com" target="_blank" rel="noopener">Sakugabooru</a>,
    classés par amvauto selon leur utilisabilité au montage. Les extraits restent la propriété de leurs studios.
  </footer>
</div>

<div class="basket" id="basket" hidden>
  <div class="basket-inner">
    <span class="count" id="count"></span>
    <button type="button" id="clear">Vider</button>
    <button type="button" id="copy">Copier les liens</button>
    <button type="button" class="primary" id="export">Exporter la liste</button>
  </div>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const state = { mood: null, anime: "", rushes: [], picked: new Map(), busy: false };

/* --- thème ---------------------------------------------------------- */
const stored = localStorage.getItem("amvauto-theme");
if (stored) document.documentElement.dataset.theme = stored;
$("theme").addEventListener("click", () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const current = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("amvauto-theme", next);
});

/* --- ambiances ------------------------------------------------------- */
const moods = await fetch("/api/moods").then((r) => r.json()).catch(() => ({ moods: [] }));
const moodBar = $("moods");
for (const item of [{ key: "", label: "Toutes" }, ...moods.moods]) {
  const chip = document.createElement("button");
  chip.className = "chip";
  chip.type = "button";
  chip.textContent = item.label;
  chip.setAttribute("aria-pressed", item.key === "" ? "true" : "false");
  chip.addEventListener("click", () => {
    state.mood = item.key || null;
    moodBar.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === chip)));
    if (state.anime) search();
  });
  moodBar.append(chip);
}

/* --- suggestions ----------------------------------------------------- */
const box = $("suggest");
let timer;
$("anime").addEventListener("input", (event) => {
  clearTimeout(timer);
  const value = event.target.value;
  timer = setTimeout(async () => {
    if (!value.trim()) return hideSuggest();
    const data = await fetch(`/api/suggest?q=${encodeURIComponent(value)}`).then((r) => r.json());
    if (!data.series.length) return hideSuggest();
    box.replaceChildren(...data.series.map((serie) => {
      const item = document.createElement("button");
      item.type = "button";
      item.innerHTML = `<span></span><code></code>`;
      item.firstChild.textContent = serie.display;
      item.lastChild.textContent = serie.tag.split(" ")[0].replace(/^~/, "");
      item.addEventListener("click", () => { $("anime").value = serie.display; hideSuggest(); search(); });
      return item;
    }));
    box.hidden = false;
  }, 140);
});
const hideSuggest = () => { box.hidden = true; };
$("anime").addEventListener("keydown", (event) => {
  if (event.key === "Enter") { hideSuggest(); search(); }
  if (event.key === "Escape") hideSuggest();
});
document.addEventListener("click", (event) => { if (!box.contains(event.target) && event.target !== $("anime")) hideSuggest(); });

/* --- recherche ------------------------------------------------------- */
$("go").addEventListener("click", () => search());

async function search() {
  const anime = $("anime").value.trim();
  if (!anime || state.busy) return;
  state.anime = anime;
  state.busy = true;
  $("go").disabled = true;
  skeletons();

  const url = `/api/rushes?anime=${encodeURIComponent(anime)}${state.mood ? `&mood=${state.mood}` : ""}&top=24`;
  try {
    const response = await fetch(url);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "réponse invalide");
    state.rushes = data.rushes;
    render(data);
  } catch (error) {
    $("out").innerHTML = "";
    const box = document.createElement("div");
    box.className = "status error";
    box.textContent = error.message;
    $("out").append(box);
  } finally {
    state.busy = false;
    $("go").disabled = false;
  }
}

function skeletons() {
  const grid = document.createElement("div");
  grid.className = "grid";
  for (let i = 0; i < 8; i += 1) {
    const cell = document.createElement("div");
    cell.className = "skeleton";
    grid.append(cell);
  }
  $("out").replaceChildren(grid);
}

function render(data) {
  const head = document.createElement("div");
  head.className = "result-head";
  const title = document.createElement("h2");
  title.textContent = data.anime;
  const meta = document.createElement("span");
  meta.className = "meta";
  meta.textContent = `${data.rushes.length} rushs retenus sur ${data.total} cuts · tag ${data.tag}`;
  head.append(title, meta);

  const grid = document.createElement("div");
  grid.className = "grid";
  data.rushes.forEach((rush, index) => grid.append(card(rush, index + 1)));

  $("out").replaceChildren(head, grid);
}

function card(rush, position) {
  const el = document.createElement("article");
  el.className = "cut";
  if (state.picked.has(rush.id)) el.classList.add("picked");

  const frame = document.createElement("button");
  frame.className = "frame";
  frame.type = "button";
  frame.title = "Lire l'extrait";
  const img = document.createElement("img");
  img.src = rush.preview;
  img.alt = "";
  img.loading = "lazy";
  const play = document.createElement("span");
  play.className = "play";
  play.textContent = "▶";
  const score = document.createElement("span");
  score.className = "score";
  score.textContent = rush.score.toFixed(1);
  const rank = document.createElement("span");
  rank.className = "rank";
  rank.textContent = `#${position}`;
  frame.append(img, play, score, rank);
  frame.addEventListener("click", () => playInline(frame, rush));

  const body = document.createElement("div");
  body.className = "body";

  const artists = document.createElement("p");
  artists.className = "artists" + (rush.artists.length ? "" : " unknown");
  artists.textContent = rush.artists.join(", ") || "Animateur non identifié";

  const specs = document.createElement("div");
  specs.className = "specs";
  specs.textContent = [
    rush.source || "source inconnue",
    `${rush.width}×${rush.height}`,
    `${rush.mb} Mo`,
    `${rush.votes} votes`,
  ].join("  ·  ");

  const tags = document.createElement("div");
  tags.className = "tags";
  for (const mood of rush.moods.slice(0, 2)) {
    const chip = document.createElement("span");
    chip.className = "tag";
    chip.textContent = mood;
    tags.append(chip);
  }
  for (const flag of rush.flags) {
    const chip = document.createElement("span");
    chip.className = "tag flag" + (flag === "HD" ? " hd" : "");
    chip.textContent = flag;
    tags.append(chip);
  }

  const actions = document.createElement("div");
  actions.className = "actions";
  const pick = document.createElement("button");
  pick.type = "button";
  pick.textContent = state.picked.has(rush.id) ? "Retirer" : "+ Panier";
  pick.classList.toggle("picked", state.picked.has(rush.id));
  pick.addEventListener("click", () => togglePick(rush, el, pick));
  const mp4 = document.createElement("a");
  mp4.href = rush.video;
  mp4.target = "_blank";
  mp4.rel = "noopener";
  mp4.textContent = "MP4";
  const page = document.createElement("a");
  page.href = rush.page;
  page.target = "_blank";
  page.rel = "noopener";
  page.textContent = "Fiche";
  actions.append(pick, mp4, page);

  body.append(artists, specs, tags, actions);
  el.append(frame, body);
  return el;
}

function playInline(frame, rush) {
  if (frame.querySelector("video")) return;
  const video = document.createElement("video");
  video.src = rush.video;
  video.autoplay = true;
  video.loop = true;
  video.muted = true;
  video.controls = true;
  video.playsInline = true;
  frame.replaceChildren(video);
}

/* --- panier ---------------------------------------------------------- */
function togglePick(rush, el, button) {
  if (state.picked.has(rush.id)) {
    state.picked.delete(rush.id);
    button.textContent = "+ Panier";
  } else {
    state.picked.set(rush.id, { ...rush, anime: state.anime });
    button.textContent = "Retirer";
  }
  button.classList.toggle("picked", state.picked.has(rush.id));
  el.classList.toggle("picked", state.picked.has(rush.id));
  refreshBasket();
}

function refreshBasket() {
  const size = state.picked.size;
  $("basket").hidden = size === 0;
  const mb = [...state.picked.values()].reduce((total, rush) => total + rush.mb, 0);
  $("count").innerHTML = `<b>${size}</b> rush${size > 1 ? "s" : ""} · ${mb.toFixed(1)} Mo`;
}

const shotList = () => [...state.picked.values()]
  .map((rush) => [
    `# ${rush.anime} — ${rush.artists.join(", ") || "animateur inconnu"} — ${rush.source || "source inconnue"}`,
    `# ambiance ${rush.moods.join("/")} · score ${rush.score} · ${rush.width}×${rush.height}`,
    rush.video,
    "",
  ].join("\n"))
  .join("\n");

$("copy").addEventListener("click", async () => {
  const links = [...state.picked.values()].map((rush) => rush.video).join("\n");
  await navigator.clipboard.writeText(links);
  $("copy").textContent = "Copié";
  setTimeout(() => { $("copy").textContent = "Copier les liens"; }, 1600);
});

$("export").addEventListener("click", () => {
  const blob = new Blob([shotList()], { type: "text/plain;charset=utf-8" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `amvauto-${(state.anime || "rushs").toLowerCase().replace(/\W+/g, "-")}.txt`;
  link.click();
  URL.revokeObjectURL(link.href);
});

$("clear").addEventListener("click", () => {
  state.picked.clear();
  refreshBasket();
  if (state.anime) search();
});
</script>
</body>
</html>
